services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: towertech
      POSTGRES_PASSWORD: towertech
      POSTGRES_DB: towertech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U towertech -d towertech"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://towertech:towertech@postgres:5432/towertech
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-hex-string}
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      CORS_ORIGIN: http://localhost:3000
      TRUST_PROXY: "1"
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "200"
      AUTH_RATE_LIMIT_MAX: "20"
      ADMIN_EMAIL: admin@towertech.com
      ADMIN_PASSWORD: towertechIT31A
      SEED_MOCK_ORDERS: "true"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "TowerTech <no-reply@towertech.sz>"
    ports:
      - "3000:3000"

volumes:
  pgdata:
