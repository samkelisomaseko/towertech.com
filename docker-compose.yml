# Production deployment. Supply every required value through the shell or .env.production.
# Do not commit real secrets. Copy .env.production.example to .env.production as a starting point.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-towertech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-towertech}\" -d \"$${POSTGRES_DB:-towertech}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?APP_URL is required}
      DB_AUTO_MIGRATE: "false"
      DB_AUTO_SEED: "false"
      # POSTGRES_PASSWORD must already be URL-encoded if it contains reserved characters.
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-towertech}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@towertech.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?STRIPE_PUBLISHABLE_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      MOMO_COLLECTION_URL: ${MOMO_COLLECTION_URL:?MOMO_COLLECTION_URL is required}
      MOMO_TARGET_ENVIRONMENT: ${MOMO_TARGET_ENVIRONMENT:?MOMO_TARGET_ENVIRONMENT is required}
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY:?MOMO_SUBSCRIPTION_KEY is required}
      MOMO_API_USER: ${MOMO_API_USER:?MOMO_API_USER is required}
      MOMO_API_KEY: ${MOMO_API_KEY:?MOMO_API_KEY is required}
      MOMO_CALLBACK_URL: ${MOMO_CALLBACK_URL:-}
      INSTACASH_ENDPOINT: ${INSTACASH_ENDPOINT:?INSTACASH_ENDPOINT is required}
      INSTACASH_API_KEY: ${INSTACASH_API_KEY:?INSTACASH_API_KEY is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM: ${SMTP_FROM:-TowerTech <no-reply@towertech.sz>}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
