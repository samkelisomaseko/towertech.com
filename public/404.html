<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="TowerTech - Page Not Found">
<meta name="theme-color" content="#050507">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050507'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%2300f3ff' font-family='Arial' font-weight='bold'>T</text></svg>">
<title>404 — Signal Lost | TowerTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .lost-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .lost-card { max-width: 620px; width: 100%; padding: 70px 40px; text-align: center; }
  .lost-path { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); word-break: break-all; margin-bottom: 25px; }
  .lost-path code { color: var(--warning); }
  .lost-links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
  .lost-meta { margin-top: 30px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="canvas-webgl"></canvas>
<div class="bg-gradient"></div>
<main class="lost-wrap">
  <div class="glass-panel lost-card">
    <div class="error-code">404</div>
    <div class="error-sub">Signal Lost</div>
    <h3 style="margin-bottom: 15px;">Page Not Found</h3>
    <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 10px; line-height: 1.7;">
      The page you're looking for was moved, deleted, or never existed in this sector.
      Let's get you back online.
    </p>
    <p class="lost-path" id="lost-path"></p>
    <div class="empty-actions">
      <a class="btn btn-primary" href="/"><i class="fa-solid fa-house"></i> Back to Home</a>
      <a class="btn btn-secondary" href="/index.html#shop"><i class="fa-solid fa-store"></i> Browse Shop</a>
    </div>
    <div class="lost-links">
      <a class="btn-link" href="/index.html#contact">Contact</a>
      <a class="btn-link" href="/index.html#compare">Compare</a>
      <a class="btn-link" href="/index.html#wishlist">Wishlist</a>
      <a class="btn-link" href="/index.html#dashboard">Dashboard</a>
    </div>
    <div class="lost-meta">TOWERTECH // ERR_SECTOR_NOT_FOUND</div>
  </div>
</main>
<script>
  (function () {
    var p = document.getElementById('lost-path');
    try {
      var path = window.location.pathname + window.location.search;
      if (path && path !== '/404.html') {
        p.innerHTML = 'Requested sector: <code></code>';
        p.querySelector('code').textContent = path;
      } else { p.style.display = 'none'; }
    } catch (e) { p.style.display = 'none'; }
  })();
</script>
</body>
</html>
